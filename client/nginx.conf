server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forwarded to the backend container so the SPA's existing relative
    # `/api/...` calls work unchanged inside Docker Compose.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unmatched paths fall back to index.html so
    # React Router (not nginx) decides what to render.
    location / {
        try_files $uri /index.html;
    }
}
