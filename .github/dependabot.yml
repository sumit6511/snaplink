version: 2
updates:
  # npm workspaces (root, client, server) share one lockfile, so pointing
  # Dependabot at "/" covers all three package.json files in one PR stream.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
