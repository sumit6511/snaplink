# Local development / demo stack. Production deployments typically use a
# managed MongoDB (Atlas) instead of the mongo service below — see the
# README's Deployment section.
#
# Usage:
#   cp server/.env.example server/.env   # fill in real JWT secrets
#   docker compose up --build
#   -> client: http://localhost:8080
#   -> server: http://localhost:5000

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/snaplink
      PORT: 5000
      CLIENT_URL: http://localhost:8080
      BASE_URL: http://localhost:5000
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  mongo_data:
